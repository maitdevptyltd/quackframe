name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            install-arguments: ""
          - python-version: "3.13"
            install-arguments: ""
          - python-version: "3.13"
            install-arguments: "--extras prefect"

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install dependencies
        run: poetry install --no-interaction ${{ matrix.install-arguments }}
      - name: Lint
        run: poetry run ruff check src tests examples/basic/run.py
      - name: Check formatting
        run: poetry run ruff format --check src tests examples/basic/run.py
      - name: Test
        run: poetry run pytest --cov=quackframe --cov-report=term-missing
      - name: Type check
        if: matrix.install-arguments != ''
        run: poetry run pyright
      - name: Check documentation links
        run: python .agents/skills/quackframe-documentation/scripts/check_doc_links.py
