name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: ""
          - python-version: "3.13"
            extras: ""
          - python-version: "3.13"
            extras: "--extra prefect"

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked ${{ matrix.extras }}
      - name: Lint
        run: uv run ruff check src tests examples/basic/run.py
      - name: Check formatting
        run: uv run ruff format --check src tests examples/basic/run.py
      - name: Test
        run: uv run pytest --cov=quackframe --cov-report=term-missing
      - name: Type check
        if: matrix.extras != ''
        run: uv run pyright
      - name: Check documentation links
        run: python .agents/skills/quackframe-documentation/scripts/check_doc_links.py
